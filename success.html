<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preorder confirmed — FLYSWATTER</title>
<link rel="icon" type="image/png" href="assets/fly-favicon-black.png?v=3">
<style>
:root{--ink:#171612;--cream:#F3E0C4;--burgundy:#4E2630;--olive:#384A28;--orange:#C14B10}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--cream);background-image:url("assets/website-background-final.webp");background-size:cover;background-position:center top;background-attachment:fixed}
body{display:flex;flex-direction:column}
.nav{display:flex;align-items:center;justify-content:center;background:var(--burgundy);padding:26px 28px}
.brand-logo{display:block;width:min(380px,70vw);height:auto}
.confirmation{width:min(720px,calc(100% - 40px));margin:auto;padding:80px 0;flex:1;display:grid;place-items:center}
.card{background:rgba(243,224,196,.9);border:5px solid var(--burgundy);border-radius:22px;padding:48px 42px;text-align:center;box-shadow:8px 8px 0 var(--burgundy)}
.check{width:68px;height:68px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:var(--olive);color:#fff;font-size:2.2rem;font-weight:900}
h1{margin:0 0 18px;color:var(--olive);font-size:clamp(2.4rem,7vw,5rem);line-height:.9;letter-spacing:-.05em}
p{font-size:1.1rem;line-height:1.6;color:#4e5b54}
.button{display:inline-block;margin-top:16px;background:var(--orange);color:#fff;text-decoration:none;padding:15px 22px;border-radius:12px;font-weight:900;box-shadow:5px 5px 0 var(--ink)}
.footer{position:relative;background:var(--burgundy);color:var(--cream);padding:24px 28px 20px;text-align:center}
.footer-logo{position:absolute;right:28px;top:0;width:180px;transform:translateY(-42%)}
@media(max-width:760px){.card{padding:38px 24px}.footer{padding-top:62px}.footer-logo{width:150px;right:20px}}
</style>
</head>
<body>
<header class="nav"><a href="index.html" aria-label="FLYSWATTER home"><img class="brand-logo" src="assets/flyswatter-logo-new.webp" alt="FLYSWATTER"></a></header>
<main class="confirmation">
<section class="card">
<div class="check">✓</div>
<h1>Your preorder is confirmed.</h1>
<p>Thanks for preordering FLYSWATTER. Stripe will send your payment receipt and preorder details to the email address you provided.</p>
<a class="button" href="index.html">Back to FLYSWATTER</a>
</section>
</main>
<footer class="footer"><img class="footer-logo" src="assets/kingpin-entertainment-logo.webp" alt="Kingpin Entertainment">© Kingpin Entertainment</footer>
</body>
</html>
